# i3-nice-layout – mode-based bindings (friendlier for discovery)
# Copy into ~/.config/i3/config (or include this file).
#
# Enter the mode with $mod+Shift+n, then use the single-key sub-bindings.
# Escape / Return / n leave the mode.
#
# Prerequisite:
#   exec_always --no-startup-id i3-nice-layout daemon

# Enter “nice” mode
bindsym $mod+Shift+n mode "nice"

mode "nice" {
    # Roll-up (geometry variant) – focused window
    bindsym r       exec --no-startup-id i3-nice-layout rollup toggle
    bindsym Shift+r exec --no-startup-id i3-nice-layout rollup toggle

    # Quick pool views (JSON to stdout; pipe or notify later if you want)
    bindsym p       exec --no-startup-id i3-nice-layout pool list
    bindsym f       exec --no-startup-id i3-nice-layout pool list --floating
    bindsym u       exec --no-startup-id i3-nice-layout pool list --rolled

    # Group follow. One-shot uses the focused window's only group.
    # Watch polls during a drag; there is no UI, only the daemon log.
    # bindsym g       exec --no-startup-id i3-nice-layout follow
    # bindsym Shift+g exec --no-startup-id i3-nice-layout follow --watch --group NAME
    # bindsym a       exec --no-startup-id i3-nice-layout follow --anchor --group NAME

    # Leave mode
    bindsym Return mode "default"
    bindsym Escape mode "default"
    bindsym n      mode "default"
    bindsym $mod+Shift+n mode "default"
}
