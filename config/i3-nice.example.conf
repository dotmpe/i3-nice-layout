# i3-nice-layout – direct bindings (no mode)
# Copy the bits you want into ~/.config/i3/config (or include this file).
#
# Prerequisite: the daemon is running
#   exec_always --no-startup-id i3-nice-layout daemon

# Toggle roll-up (geometry shrink/restore) for the focused window
bindsym $mod+Shift+n exec --no-startup-id i3-nice-layout rollup toggle

# Optional extras (uncomment as needed)
# bindsym $mod+Shift+p exec --no-startup-id i3-nice-layout pool list --floating
# bindsym $mod+Shift+t exec --no-startup-id i3-nice-layout pool list --tag work
