# i3-nice-layout – direct bindings (no mode)
# Copy the bits you want into ~/.config/i3/config (or include this file).
#
# Prerequisite: the daemon is running
#   exec_always --no-startup-id i3-nice-layout daemon

# Toggle roll-up (geometry shrink/restore) for the focused window
#bindsym $mod+Shift+n exec --no-startup-id i3-nice-layout rollup toggle

# Use stand-in title (needs i3-nice-gui) instead of shrinking. Neither i3 nor
# many apps like being resized to nearly zero. Using stand-in windows does spam
# the scratchpad with all actual windows (if you ever cycle through them all).
bindsym $alt+Shift+n exec --no-startup-id i3-nice-layout rollup toggle --stand-in
bindsym Ctrl+button1 exec --no-startup-id i3-nice-layout rollup toggle --stand-in
# The daemon or this exec needs I3_NICE_STAND_IN. See HACKING.md.
# NOTE: i3 `set $name` does not export

# Group follow (no on-screen feedback; the daemon logs poll_ms / ipc_ms).
# Put windows in a group first:
#   i3-nice-layout group [--id=<con_id>] NAME
# If you have yad installed, use this example script to add groups manually:
#bindsym Ctrl+Shift+g exec --no-startup-id bash -c ". ~/project/i3-nice-layout/config/i3-nice-util.sh && i3nice::xwinsel::group_window"
# After dragging any window or the leader, shift the others by the same delta:
bindsym $mod+Shift+g exec --no-startup-id i3-nice-layout follow
# Like rollup, this can get the con-id from focus and then apply without group
# given (but only if the window is not in multiple groups).

# Or poll while the button is down (start this, then drag):
# bindsym $mod+Shift+g exec --no-startup-id i3-nice-layout follow --watch --group NAME
# bindsym $mod+Shift+g exec --no-startup-id i3-nice-layout follow --unwatch --group NAME

